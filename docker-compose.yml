services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-linkpulse}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:26.8.6.5
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-linkpulse}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-linkpulse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-linkpulse}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1'"]
      interval: 3s
      timeout: 3s
      retries: 30
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped

  analytics-service:
    build:
      context: .
      args:
        SERVICE: analytics-service
    environment:
      GRPC_PORT: "9090"
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-linkpulse}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-linkpulse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-linkpulse}
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/app", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s
    stop_grace_period: 25s
    restart: unless-stopped

  link-service:
    build:
      context: .
      args:
        SERVICE: link-service
    environment:
      HTTP_PORT: "8080"
      POSTGRES_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-linkpulse}?sslmode=disable
      ANALYTICS_GRPC_ADDR: analytics-service:9090
    ports:
      - "127.0.0.1:${HTTP_BIND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/app", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s
    stop_grace_period: 25s
    restart: unless-stopped

volumes:
  postgres_data:
  clickhouse_data:
